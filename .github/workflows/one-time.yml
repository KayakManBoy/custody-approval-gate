# Public repository only. Never copy the private repository or any production credentials.
name: One-time independently reviewed signing-key custody
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'CHECK_ONLY (no secrets) or CREATE_ONCE (separate authorization required)'
        required: true
        type: choice
        default: CHECK_ONLY
        options:
          - CHECK_ONLY
          - CREATE_ONCE
permissions: {}
concurrency:
  group: one-time-signing-key-custody
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.repository == 'KayakManBoy/custody-approval-gate' && github.actor == 'KayakManBoy' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read GitHub protection rules only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REVIEWER: ${{ vars.INDEPENDENT_REVIEWER_LOGIN }}
        run: |
          node --check scripts/verify-gate.mjs
          node scripts/verify-gate.mjs
  create:
    needs: inspect
    if: ${{ github.repository == 'KayakManBoy/custody-approval-gate' && github.actor == 'KayakManBoy' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'CREATE_ONCE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment: signer-custody-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create exactly one protected signing key (separate approval and consent required)
        env:
          CUSTODY_ACTION: ${{ inputs.action }}
          APPROVED_COMMIT_SHA: ${{ vars.APPROVED_COMMIT_SHA }}
          CF_TEMP_EDIT_TOKEN: ${{ secrets.CF_TEMP_EDIT_TOKEN }}
          CF_TARGET_ACCOUNT: ${{ secrets.CF_TARGET_ACCOUNT }}
          CF_TARGET_STORE: ${{ secrets.CF_TARGET_STORE }}
          CF_TARGET_SECRET_NAME: ${{ secrets.CF_TARGET_SECRET_NAME }}
        run: |
          node --check scripts/create-once.mjs
          node scripts/create-once.mjs
